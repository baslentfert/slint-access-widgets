name: CI
on: [push, pull_request]

jobs:
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  examples-and-screen-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: system packages (fonts, invisible display, accessibility bus)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb xdotool xclip \
            at-spi2-core python3-pyatspi dbus-x11 fonts-noto-core
      - name: build and lint the examples
        run: |
          for e in basic gallery transfer remote autocomplete controls tree transfer-list notices dialog; do
            cargo clippy --manifest-path examples/$e/Cargo.toml -- -D warnings
            cargo build --manifest-path examples/$e/Cargo.toml
          done
      - name: what a screen reader gets, key by key
        # No OpenGL on the runner: Slint's software renderer.
        env:
          SLINT_BACKEND: winit-software
        run: scripts/headless.sh python3 -I scripts/a11y-test.py
