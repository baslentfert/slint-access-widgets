[package]
name = "slint-a11y-check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "See your Slint app the way a screen reader does: read the accessibility tree (AT-SPI on Linux, UI Automation on Windows) in tests."
keywords = ["slint", "accessibility", "a11y", "testing", "screen-reader"]
categories = ["gui", "accessibility", "development-tools::testing"]
readme = "../README.md"
# Comes later: not published yet.
publish = false

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
